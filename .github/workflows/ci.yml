name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The crate is warning-free on the pinned toolchain in every feature
  # combination below, so warnings are treated as errors.
  RUSTFLAGS: -D warnings

jobs:
  corpus:
    name: Shared corpus and artifact provenance
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Corpus and real retrieval pipeline tests
        run: python -m unittest discover -s tools/tests -v
      - name: Native Core ML benchmark compiles
        if: runner.os == 'macOS'
        run: swiftc -warnings-as-errors -O tools/autosuggest/apple/benchmark.swift -o "$RUNNER_TEMP/obadh-coreml-benchmark"

  neural-contracts:
    name: Neural checkpoints, tokenization and portable exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/autosuggest/requirements-tests.lock
      - name: Install CPU training and export dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/autosuggest/requirements-tests.lock
      - name: Check neural, corpus and export contracts
        run: python -m unittest discover -s tools/tests -v

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # data/autocorrect and data/autosuggest are Git-LFS submodules holding
          # the FST and n-gram artifacts. The test suite must pass without them:
          # it reads only the in-repo data/rules files, and the CLI tests write
          # their own temp fixtures. Not checking them out keeps that honest.
          submodules: false

      # The toolchain (1.89.0) and the wasm32 target both come from
      # rust-toolchain.toml; rustup installs them on the first cargo call.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Core tests
        run: cargo test --locked

      - name: CLI tests
        run: cargo test --locked --features cli

      - name: C ABI tests
        run: cargo test --locked --features cabi

      - name: WASM target check
        run: >
          cargo check --locked --target wasm32-unknown-unknown
          --no-default-features --features wasm --lib

      - name: Benchmarks compile
        run: cargo bench --locked --bench hot_path --no-run
